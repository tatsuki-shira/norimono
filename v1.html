<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="のりもの">
<title>のりもの なにかな？</title>
<style>
  :root {
    --bg: #fff6e5;
    --ink: #3a3a48;
    --font: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Hiragino Sans", "Rounded Mplus 1c", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink); font-family: var(--font);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overscroll-behavior: none;
  }

  /* ---------- ホーム：乗り物カード ---------- */
  #grid {
    height: 100dvh;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: clamp(12px, 2.5vmin, 28px);
    padding: max(clamp(12px, 2.5vmin, 28px), env(safe-area-inset-top)) clamp(12px, 2.5vmin, 28px) max(clamp(12px, 2.5vmin, 28px), env(safe-area-inset-bottom));
  }
  .card {
    border: none; border-radius: clamp(20px, 4vmin, 40px);
    background: var(--card); color: var(--ink); font: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2vmin; padding: 2vmin; cursor: pointer;
    box-shadow: 0 1.2vmin 0 var(--shadow);
    transition: transform .12s, box-shadow .12s;
  }
  .card:active { transform: translateY(1vmin) scale(.97); box-shadow: 0 .2vmin 0 var(--shadow); }
  .card svg { width: 88%; max-height: 70%; animation: bob 2.4s ease-in-out infinite; }
  .card:nth-child(2) svg { animation-delay: -.6s; }
  .card:nth-child(3) svg { animation-delay: -1.2s; }
  .card:nth-child(4) svg { animation-delay: -1.8s; }
  .card .label { font-size: clamp(22px, 4.6vmin, 56px); font-weight: 700; letter-spacing: .05em; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4%); } }

  /* 回転灯・タイヤ */
  .beacon { animation: blink .45s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .wheel { transform-box: fill-box; transform-origin: center; }
  .moving .wheel { animation: spin .45s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 走るシーン ---------- */
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    background: linear-gradient(#8fd3ff, #d9f1ff 70%);
    opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  #stage.show { opacity: 1; pointer-events: auto; }
  .cloud {
    position: absolute; background: #fff; border-radius: 999px; opacity: .9;
    animation: drift 30s linear infinite;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 50%; height: 160%; left: 15%; bottom: 20%; }
  .cloud::after { width: 35%; height: 120%; right: 15%; bottom: 25%; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-40vw); } }

  .fuji {
    position: absolute; left: 50%; bottom: 30vh; width: 70vmin; height: 30vmin;
    transform: translateX(-50%);
    background: linear-gradient(#ffffff 0 28%, #5b7fb8 28%);
    clip-path: polygon(0 100%, 40% 8%, 60% 8%, 100% 100%);
    display: none;
  }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 32vh; background: #8fd16a; }
  .road {
    position: absolute; left: 0; right: 0; bottom: 8vh; height: 17vh; background: #6b7078;
    display: none;
  }
  .road::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.2vh; transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, #fff 0 8vw, transparent 8vw 14vw);
  }
  .ballast { position: absolute; left: 0; right: 0; bottom: 12vh; height: 7vh; background: #b9aa97; display: none; }

  #stage.scene-rail .fuji, #stage.scene-rail .ballast { display: block; }
  #stage.scene-road .road { display: block; }

  #stageName {
    position: absolute; top: max(8vh, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
    font-size: clamp(44px, 11vmin, 140px); font-weight: 800; color: #ff6b35;
    text-shadow: 0 0 1.2vmin #fff, 0 0 .5vmin #fff, 0 .7vmin 0 rgba(0,0,0,.15);
    letter-spacing: .06em;
    transform: scale(0);
  }
  #stage.show #stageName { animation: pop .6s cubic-bezier(.3,1.6,.5,1) .35s forwards; }
  @keyframes pop { to { transform: scale(1); } }

  #mover { position: absolute; left: 0; will-change: transform; }
  #mover svg { width: 100%; display: block; }
  #stage.scene-road #mover { width: 70vw; bottom: 12vh; transform: translateX(-80vw); }
  #stage.scene-rail #mover { width: 140vw; bottom: 13vh; transform: translateX(-150vw); }
  #stage.scene-road.show #mover { animation: drive-stop 4.6s forwards; }
  #stage.scene-rail.show #mover { animation: pass 3.9s cubic-bezier(.35,0,.65,1) .2s forwards; }
  #stage.scene-road.show #mover svg { animation: rumble .25s ease-in-out infinite; }

  @keyframes drive-stop {
    0%   { transform: translateX(-80vw); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
    30%  { transform: translateX(15vw); }
    60%  { transform: translateX(15vw); animation-timing-function: cubic-bezier(.6,0,.8,.5); }
    100% { transform: translateX(110vw); }
  }
  @keyframes pass { from { transform: translateX(-150vw); } to { transform: translateX(110vw); } }
  @keyframes rumble { 50% { transform: translateY(-.6%); } }
</style>
</head>
<body>

<main id="grid"></main>

<div id="stage" aria-hidden="true">
  <div class="cloud" style="top:14vh;left:62vw;width:18vmin;height:6vmin"></div>
  <div class="cloud" style="top:26vh;left:12vw;width:24vmin;height:7vmin;animation-duration:42s"></div>
  <div class="fuji"></div>
  <div class="ground"></div>
  <div class="ballast"></div>
  <div class="road"></div>
  <div id="stageName"></div>
  <div id="mover"></div>
</div>

<script>
/* ================= 乗り物のイラスト（右向き） ================= */
const wheel = (cx, cy, r) => `
  <g class="wheel">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#23262b"/>
    <circle cx="${cx}" cy="${cy}" r="${r * .5}" fill="#c9ced6"/>
    <rect x="${cx - 2}" y="${cy - r * .5}" width="4" height="${r}" fill="#7d858f"/>
    <rect x="${cx - r * .5}" y="${cy - 2}" width="${r}" height="4" fill="#7d858f"/>
  </g>`;

const NOSE = "M10,60 L250,60 C318,60 362,92 400,130 Q410,146 394,152 L10,152 Z";

function n700(uid, twoCars) {
  const windows = (x0, x1) => {
    let h = "";
    for (let x = x0; x <= x1; x += 26) h += `<rect x="${x}" y="80" width="16" height="15" rx="4" fill="#2d3a4a"/>`;
    return h;
  };
  const bogies = xs => xs.map(x => `
    <rect x="${x}" y="150" width="70" height="14" rx="6" fill="#4a4f57"/>
    <circle cx="${x + 16}" cy="164" r="8" fill="#2b2f35"/>
    <circle cx="${x + 54}" cy="164" r="8" fill="#2b2f35"/>`).join("");
  const stripes = (x, w) => `
    <rect x="${x}" y="118" width="${w}" height="12" fill="#1f5fbf"/>
    <rect x="${x}" y="134" width="${w}" height="4" fill="#1f5fbf"/>
    <rect x="${x}" y="142" width="${w}" height="9" fill="#d5dbe2"/>`;

  const lead = `
    ${bogies([40, 250])}
    <defs><clipPath id="nose-${uid}"><path d="${NOSE}"/></clipPath></defs>
    <g clip-path="url(#nose-${uid})">
      <rect x="0" y="50" width="420" height="110" fill="#fbfcfd"/>
      ${stripes(0, 420)}
    </g>
    <path d="${NOSE}" fill="none" stroke="#98a2ad" stroke-width="3"/>
    ${windows(30, 220)}
    <rect x="244" y="72" width="16" height="44" rx="3" fill="none" stroke="#b8c0c8" stroke-width="2"/>
    <path d="M292,72 C318,76 338,88 354,104 L324,104 C312,92 302,82 292,79 Z" fill="#2d3a4a"/>
    <ellipse cx="386" cy="137" rx="8" ry="4" fill="#ffe27a"/>`;

  if (!twoCars) {
    return `<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="170" width="420" height="6" fill="#8a8f98"/>${lead}</svg>`;
  }
  const middle = `
    ${bogies([40, 270])}
    <rect x="10" y="60" width="380" height="92" rx="8" fill="#fbfcfd" stroke="#98a2ad" stroke-width="3"/>
    ${stripes(11.5, 377)}
    ${windows(40, 340)}
    <rect x="388" y="76" width="24" height="64" fill="#7d858f"/>`;
  return `<svg viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="170" width="820" height="6" fill="#8a8f98"/>
    ${middle}<g transform="translate(400,0)">${lead}</g></svg>`;
}

function fireTruck() {
  let rungs = "";
  for (let x = 45; x < 280; x += 22) rungs += `<rect x="${x}" y="50" width="4" height="14" fill="#9aa3ad"/>`;
  return `<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="70" width="285" height="88" rx="10" fill="#e53935"/>
    <rect x="40" y="80" width="75" height="32" rx="5" fill="#c62828"/>
    <rect x="125" y="80" width="75" height="32" rx="5" fill="#c62828"/>
    <rect x="210" y="80" width="75" height="32" rx="5" fill="#c62828"/>
    <path d="M300,55 L360,55 Q380,55 388,75 L402,112 L402,158 L300,158 Z" fill="#e53935"/>
    <path d="M318,68 L356,68 Q368,68 373,80 L383,106 L318,106 Z" fill="#bfe6ff" stroke="#8b1d1b" stroke-width="3"/>
    <rect x="20" y="120" width="382" height="8" fill="#fff"/>
    <rect x="60" y="60" width="10" height="12" fill="#9aa3ad"/>
    <rect x="245" y="60" width="10" height="12" fill="#9aa3ad"/>
    <rect x="30" y="48" width="255" height="18" rx="4" fill="none" stroke="#cfd4da" stroke-width="5"/>
    ${rungs}
    <rect class="beacon" x="318" y="42" width="32" height="14" rx="5" fill="#ff5252"/>
    <rect x="392" y="142" width="18" height="14" rx="4" fill="#9aa3ad"/>
    <circle cx="396" cy="126" r="6" fill="#ffe27a"/>
    ${wheel(100, 160, 26)}${wheel(330, 160, 26)}
  </svg>`;
}

function ambulance(uid) {
  const body = "M20,55 Q20,45 30,45 L300,45 Q318,45 330,60 L372,100 Q400,106 400,125 L400,150 Q400,158 392,158 L28,158 Q20,158 20,150 Z";
  return `<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="amb-${uid}"><path d="${body}"/></clipPath></defs>
    <path d="${body}" fill="#fdfdfd"/>
    <g clip-path="url(#amb-${uid})"><rect x="0" y="112" width="420" height="12" fill="#e53935"/></g>
    <path d="${body}" fill="none" stroke="#b8c0c8" stroke-width="3"/>
    <path d="M305,60 L326,62 L360,100 L305,100 Z" fill="#bfe6ff" stroke="#7a8691" stroke-width="3"/>
    <rect x="228" y="60" width="62" height="38" rx="5" fill="#bfe6ff" stroke="#7a8691" stroke-width="3"/>
    <rect x="115" y="62" width="14" height="42" rx="2" fill="#e53935"/>
    <rect x="101" y="76" width="42" height="14" rx="2" fill="#e53935"/>
    <line x1="215" y1="52" x2="215" y2="156" stroke="#d0d5db" stroke-width="2"/>
    <rect class="beacon" x="262" y="33" width="36" height="13" rx="5" fill="#ff3b3b"/>
    <rect class="beacon" x="30" y="33" width="26" height="13" rx="5" fill="#ff3b3b" style="animation-delay:-.22s"/>
    <circle cx="394" cy="120" r="6" fill="#ffe27a"/>
    ${wheel(90, 160, 24)}${wheel(322, 160, 24)}
  </svg>`;
}

function policeCar(uid) {
  const body = "M20,112 Q20,100 34,98 L108,96 L148,62 Q156,56 170,56 L270,56 Q284,56 294,66 L326,96 L386,102 Q402,104 402,120 L402,146 Q402,156 392,156 L28,156 Q20,156 20,146 Z";
  return `<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="pol-${uid}"><path d="${body}"/></clipPath></defs>
    <path d="${body}" fill="#1f2228"/>
    <g clip-path="url(#pol-${uid})"><rect x="112" y="40" width="210" height="92" fill="#fbfcfd"/></g>
    <path d="${body}" fill="none" stroke="#1f2228" stroke-width="3"/>
    <path d="M162,68 L206,68 L206,96 L130,96 Z" fill="#bfe6ff" stroke="#7a8691" stroke-width="2"/>
    <path d="M216,68 L266,68 Q275,68 281,74 L303,96 L216,96 Z" fill="#bfe6ff" stroke="#7a8691" stroke-width="2"/>
    <line x1="211" y1="98" x2="211" y2="130" stroke="#c3c9d0" stroke-width="2"/>
    <circle cx="258" cy="114" r="9" fill="#f2c230"/>
    <rect class="beacon" x="182" y="42" width="56" height="14" rx="5" fill="#ff3b3b"/>
    <circle cx="394" cy="116" r="6" fill="#ffe27a"/>
    ${wheel(95, 156, 24)}${wheel(322, 156, 24)}
  </svg>`;
}

/* ================= 音（Web Audio で合成） ================= */
let ctx, master, noiseBuf;

function ensureAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === "suspended") ctx.resume();
}

// 近づいて遠ざかる感じのフェード
function soundBus(dur) {
  const g = ctx.createGain(), t = ctx.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(1, t + 0.8);
  g.gain.setValueAtTime(1, t + dur - 1.2);
  g.gain.linearRampToValueAtTime(0, t + dur);
  g.connect(master);
  return g;
}

function wail(bus, t, dur, lo, hi, up, down, vol) {
  const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = "sawtooth"; f.type = "lowpass"; f.frequency.value = 1800; g.gain.value = vol;
  o.connect(f).connect(g).connect(bus);
  o.frequency.setValueAtTime(lo, t);
  for (let s = t; s < t + dur; s += up + down) {
    o.frequency.linearRampToValueAtTime(hi, s + up);
    o.frequency.linearRampToValueAtTime(lo, s + up + down);
  }
  o.start(t); o.stop(t + dur);
}

function bell(bus, t) {
  [1480, 2230].forEach((freq, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(i ? 0.12 : 0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g).connect(bus);
    o.start(t); o.stop(t + 0.3);
  });
}

const SOUNDS = {
  // ピーポーピーポー
  ambulance(dur) {
    const t = ctx.currentTime, bus = soundBus(dur);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle"; g.gain.value = 0.4;
    o.connect(g).connect(bus);
    for (let i = 0, s = t; s < t + dur; i++, s += 0.62) o.frequency.setValueAtTime(i % 2 ? 770 : 960, s);
    o.start(t); o.stop(t + dur);
  },
  // ウ〜〜ウ〜〜
  police(dur) {
    const t = ctx.currentTime, bus = soundBus(dur);
    wail(bus, t, dur, 450, 1050, 0.9, 1.3, 0.16);
  },
  // ウ〜〜 ＋ カンカンカン
  fire(dur) {
    const t = ctx.currentTime, bus = soundBus(dur);
    wail(bus, t, dur, 380, 820, 1.4, 1.4, 0.1);
    for (let s = t + 0.1; s < t + dur; s += 0.32) bell(bus, s);
  },
  // ファーン ＋ びゅーん
  shinkansen(dur) {
    const t = ctx.currentTime;
    [466, 587].forEach(freq => {
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.value = freq;
      f.type = "lowpass"; f.frequency.value = 1400;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.09, t + 0.05);
      g.gain.setValueAtTime(0.09, t + 0.6);
      g.gain.linearRampToValueAtTime(0, t + 0.8);
      o.connect(f).connect(g).connect(master);
      o.start(t); o.stop(t + 0.85);
    });
    const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noiseBuf; n.loop = true;
    bp.type = "bandpass"; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(350, t);
    bp.frequency.linearRampToValueAtTime(1700, t + dur * 0.55);
    bp.frequency.linearRampToValueAtTime(450, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.9, t + dur * 0.55);
    g.gain.linearRampToValueAtTime(0, t + dur);
    n.connect(bp).connect(g).connect(master);
    n.start(t); n.stop(t + dur);
  },
};

/* ================= 声（読み上げ） ================= */
let jaVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.replace("_", "-").startsWith("ja"));
  jaVoice = voices.find(v => /Kyoko|O-ren|Otoya/.test(v.name)) || voices[0] || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.addEventListener?.("voiceschanged", pickVoice);
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  if (jaVoice) u.voice = jaVoice;
  u.rate = 0.9; u.pitch = 1.25; u.volume = 1;
  speechSynthesis.speak(u);
}

/* ================= 乗り物リスト ================= */
const VEHICLES = [
  { name: "しんかんせん",   say: "しんかんせん！ エヌななひゃくけい！", card: "#dff1ff", shadow: "#a9d3f2", scene: "rail", sound: "shinkansen", dur: 4.1,
    art: uid => n700(uid, false), stageArt: uid => n700(uid, true) },
  { name: "しょうぼうしゃ", say: "しょうぼうしゃ！ カンカンカン！", card: "#ffe1dc", shadow: "#f3aca1", scene: "road", sound: "fire", dur: 4.6,
    art: fireTruck },
  { name: "きゅうきゅうしゃ", say: "きゅうきゅうしゃ！ ピーポーピーポー！", card: "#fff0c9", shadow: "#ecd08a", scene: "road", sound: "ambulance", dur: 4.6,
    art: ambulance },
  { name: "パトカー",       say: "パトカー！ ウーウー！", card: "#e3e8ff", shadow: "#b0bbef", scene: "road", sound: "police", dur: 4.6,
    art: policeCar },
];

/* ================= 画面 ================= */
const grid = document.getElementById("grid");
const stage = document.getElementById("stage");
const mover = document.getElementById("mover");
const stageName = document.getElementById("stageName");
let busy = false;

VEHICLES.forEach((v, i) => {
  const b = document.createElement("button");
  b.className = "card";
  b.style.setProperty("--card", v.card);
  b.style.setProperty("--shadow", v.shadow);
  b.innerHTML = v.art("card" + i) + `<span class="label">${v.name}</span>`;
  b.addEventListener("click", () => play(v));
  grid.appendChild(b);
});

function play(v) {
  if (busy) return;
  busy = true;
  ensureAudio();
  speak(v.say);   // iPad では「タップした瞬間」に喋らせないと声が出ないので最初に呼ぶ
  SOUNDS[v.sound](v.dur);

  stage.className = "scene-" + v.scene;
  stageName.textContent = v.name;
  mover.innerHTML = (v.stageArt || v.art)("stage");
  mover.className = "moving";
  void stage.offsetWidth;   // アニメーションを毎回最初から
  stage.classList.add("show");

  setTimeout(() => {
    stage.classList.remove("show");
    setTimeout(() => { mover.innerHTML = ""; busy = false; }, 400);
  }, v.dur * 1000 + 200);
}

// ピンチで拡大されないように（iPad Safari）
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("visibilitychange", () => {
  if (document.hidden && ctx) { ctx.suspend(); speechSynthesis?.cancel(); }
});
</script>
</body>
</html>
